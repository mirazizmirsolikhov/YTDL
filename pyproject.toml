[project]
name = "ytdl"
version = "0.1.0"
description = "Telegram bot for downloading YouTube / YouTube Shorts videos"
readme = "README.md"
# The Docker image uses python:3.11-slim; aiogram 3 also supports newer
# Python, so only a lower bound is enforced.
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "aiogram>=3.7,<4",
    "pydantic",
    "pydantic-settings",
    "kurigram",
    "tgcrypto",
    "redis",
    "yt-dlp",
    # EJS challenge-solver scripts for YouTube; run by deno (see Dockerfile).
    # Bundling the package avoids fetching remote components at runtime.
    "yt-dlp-ejs",
]

[tool.uv]
# This is an application, not an installable library — only its dependencies
# need to be synced, the project itself is run via scripts.
package = false

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "fakeredis",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
