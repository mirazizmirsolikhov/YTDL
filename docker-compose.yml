# Shared environment: reach Redis over the compose network and keep all
# persistent state under /app/data — a single bind-mounted directory, so a
# fresh server needs no pre-created files (Docker auto-creates the directory).
x-app-env: &app-env
  REDIS_HOST: redis
  DATABASE_NAME: data/users.db
  SESSION_FOLDER: data/sessions
  DOWNLOADING_DIRECTORY: data/downloads
  # Optional: drop a Netscape-format cookies.txt here to bypass YouTube's
  # bot check on VPS IPs. If the file is absent, yt-dlp runs without it.
  COOKIES_FILE: data/cookies.txt
  # PO-token provider — yt-dlp fetches YouTube proof-of-origin tokens from
  # the bgutil-provider service, which keeps downloads working on VPS IPs
  # without constant cookie re-exporting. Empty value disables it.
  POT_PROVIDER_URL: http://pot-provider:4416

# Services are split into two profiles so the bot and the userbot can run on
# separate hosts: `vps` (redis + bot) and `home` (userbot + pot-provider) —
# the userbot then downloads from a residential IP, avoiding YouTube's bot
# check. Each host sets COMPOSE_PROFILES in its .env to start only its own
# services; a single host runs everything with COMPOSE_PROFILES=vps,home.
services:
  redis:
    image: redis:7-alpine
    profiles: [vps]
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    profiles: [vps]
    working_dir: /app/bot
    command: python app.py
    env_file: .env
    environment: *app-env
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./data:/app/data

  # Mints YouTube PO tokens for yt-dlp. Pinned to match the
  # bgutil-ytdlp-pot-provider plugin version in pyproject.toml.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    profiles: [home]
    init: true
    restart: unless-stopped

  userbot:
    build: .
    profiles: [home]
    working_dir: /app/userbot
    command: python userbot.py
    env_file: .env
    environment: *app-env
    # No depends_on for redis: it lives in the `vps` profile and, once the
    # hosts are split, on a different machine. The worker retries the task
    # queue until Redis answers, so an ordering dependency is not needed.
    depends_on:
      - pot-provider
    restart: unless-stopped
    volumes:
      - ./data:/app/data

volumes:
  redis-data:
