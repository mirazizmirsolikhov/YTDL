services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    working_dir: /app/bot
    command: python app.py
    env_file: .env
    environment:
      # Override so the service reaches Redis over the compose network.
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      # Shared SQLite database (users + file_id cache backup).
      - ./users.db:/app/users.db

  userbot:
    build: .
    working_dir: /app/userbot
    command: python userbot.py
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./users.db:/app/users.db
      # Pyrogram session — reuse the host login so no re-auth is needed.
      - ./sessions:/app/sessions
      # Downloaded videos are temporary; kept off the container layer.
      - ./downloads:/app/downloads

volumes:
  redis-data:
